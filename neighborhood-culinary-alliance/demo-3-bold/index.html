<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neighborhood Culinary Alliance</title>
<meta name="description" content="Neighborhood Culinary Alliance develops food halls, culinary projects and The Mixing Bowl baking incubator.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1311; --bg2:#151A17; --card:#1B211E; --line:#2A322D; --text:#F2EEE5; --muted:#A3ABA5;
  --green:#5FB38E; --orange:#EE8640; --gold:#F2C14E; --accent:var(--green);
  --display:"Bricolage Grotesque",system-ui,sans-serif; --sans:"Manrope",system-ui,sans-serif; --w:1240px; --r:22px;
}
body[data-page=incubator]{--accent:var(--orange)} body[data-page=boys-baking]{--accent:var(--gold)}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16.5px/1.65 var(--sans)}
img{max-width:100%;display:block} a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;margin:0 0 .4em;letter-spacing:-.025em}
h1{font-size:clamp(2.8rem,8vw,6.6rem)} h2{font-size:clamp(2rem,4.6vw,3.6rem)} h3{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;line-height:1.15}
p{margin:0 0 1em}
.wrap{max-width:var(--w);margin:0 auto;padding:0 24px}
section{padding:100px 0}
.label{display:inline-flex;align-items:center;gap:8px;font:700 .76rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.label::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.acc{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;background:var(--accent);color:#0F1311;font-weight:700;text-decoration:none;border:2px solid var(--accent);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)} .btn.ghost:hover{border-color:var(--text)}
.btn::after{content:"↗";font-size:1.05em}

header.site{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:78px;gap:20px}
.logo img{height:52px;width:auto}
nav.main{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:999px}
nav.main a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.88rem;padding:9px 15px;border-radius:999px;transition:.2s;white-space:nowrap}
nav.main a:hover{color:var(--text)}
nav.main a.active{background:var(--accent);color:#0F1311}
nav.main a[data-nav=incubator]:not(.active){color:var(--orange)} nav.main a[data-nav=boys-baking]:not(.active){color:var(--gold)}
.hcta{white-space:nowrap;padding:11px 20px;font-size:.88rem}
.menu-btn{display:none;background:var(--card);border:1px solid var(--line);color:var(--text);width:46px;height:46px;border-radius:50%;font-size:1.2rem;cursor:pointer}
@media (max-width:1140px){.hcta{display:none}}
@media (max-width:980px){
  .menu-btn{display:block}
  nav.main{position:fixed;inset:78px 12px auto 12px;flex-direction:column;border-radius:var(--r);padding:10px;transform:translateY(-140%);transition:.3s;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  body.menu-open nav.main{transform:none}
  nav.main a{padding:15px 18px;font-size:1.05rem}
}

/* home */
html,body{overflow-x:clip} .hero{padding:90px 0 160px;margin-bottom:-100px;position:relative}
.hero h1 span{display:block}
.hero h1 .o{-webkit-text-stroke:2px var(--text);color:transparent}
.hero-row{display:grid;grid-template-columns:1.4fr .6fr;gap:40px;align-items:end;margin-top:28px}
.hero-row p{font-size:1.15rem;color:var(--muted);max-width:560px}
@media (max-width:860px){.hero-row{grid-template-columns:1fr}}
.glow{position:absolute;width:600px;height:600px;border-radius:50%;filter:blur(120px);opacity:.18;z-index:-1}
.bento{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:300px 300px;gap:18px}
.tile{position:relative;border-radius:var(--r);overflow:hidden;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;isolation:isolate;border:1px solid var(--line)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .6s}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 20%,rgba(10,12,11,.92) 100%)}
.tile:hover img{transform:scale(1.05)}
.tile .pill{position:absolute;top:22px;left:22px;font:700 .72rem var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-radius:999px;color:#0F1311}
.tile h3{font-size:clamp(1.8rem,3vw,2.6rem);font-weight:800;margin:0 0 6px}
.tile p{margin:0;color:#d5d9d6;max-width:440px;font-size:.95rem}
.tile .go{position:absolute;top:20px;right:20px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:1.2rem;transition:.25s}
.tile:hover .go{background:#fff;color:#0F1311;transform:rotate(45deg)}
.t1{grid-row:1/3}
@media (max-width:860px){.bento{grid-template-columns:1fr;grid-template-rows:none}.t1{grid-row:auto}.tile{min-height:320px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.stats b{display:block;font:800 3rem/1 var(--display);color:var(--accent);margin-bottom:10px;letter-spacing:-.03em}
.stats span{color:var(--muted);font-size:.92rem}
@media (max-width:860px){.stats{grid-template-columns:1fr 1fr}}
.about{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
@media (max-width:860px){.about{grid-template-columns:1fr;gap:32px}}
.about .portrait{border-radius:var(--r);overflow:hidden;aspect-ratio:1;position:sticky;top:100px}
.about .portrait img{width:100%;height:100%;object-fit:cover}
.about p{color:#cfd4d0}
.marq{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0;background:var(--bg2)}
.marq .track{display:flex;gap:28px;width:max-content;animation:slide 40s linear infinite}
.marq img{height:74px;width:110px;object-fit:contain;background:#fff;border-radius:14px;padding:8px}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq .track{animation:none;flex-wrap:wrap}}
.cta-box{background:var(--accent);color:#0F1311;border-radius:32px;padding:clamp(40px,7vw,90px);display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.cta-box h2{margin:0;color:#0F1311} .cta-box .btn{background:#0F1311;color:var(--text);border-color:#0F1311}

/* page head */
.phead{padding:90px 0 60px}
.phead p.lead{font-size:1.2rem;color:var(--muted);max-width:640px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.tabs a{background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.9rem} .tabs a:hover{border-color:var(--accent);color:var(--accent)}

/* projects */
.proj{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:grid;grid-template-columns:.9fr 1.1fr;margin-bottom:24px;scroll-margin-top:100px}
@media (max-width:860px){.proj{grid-template-columns:1fr}}
.proj > img{width:100%;height:100%;min-height:420px;object-fit:cover}
.proj .body{padding:clamp(28px,4vw,52px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.chips span{border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--accent)}
.proj p{color:#cfd4d0}
.grid-gal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:26px}
.grid-gal a{aspect-ratio:1;border-radius:12px;overflow:hidden} .grid-gal img{width:100%;height:100%;object-fit:cover;transition:.3s} .grid-gal a:hover img{transform:scale(1.08)}
.grid-gal .more{display:grid;place-items:center;background:var(--bg2);color:var(--muted);font-weight:700;font-size:.9rem;text-decoration:none}
@media (max-width:520px){.grid-gal{grid-template-columns:repeat(4,1fr)}}
.ongo{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.ongo{grid-template-columns:1fr}}
.ongo article{border:1px solid var(--line);border-radius:var(--r);padding:32px;background:linear-gradient(160deg,var(--card),var(--bg))}
.ongo .n{font:800 4rem/1 var(--display);color:transparent;-webkit-text-stroke:1.5px var(--accent);margin-bottom:22px}
.ongo p{color:var(--muted)}

/* incubator */
.mbhero{position:relative;border-radius:32px;overflow:hidden;min-height:560px;display:flex;align-items:flex-end;padding:clamp(28px,5vw,60px);isolation:isolate;margin-top:24px}
.mbhero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.mbhero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(15,19,17,.95),rgba(15,19,17,.55) 60%,rgba(15,19,17,.2))}
.mbhero .logo-chip{position:absolute;top:28px;left:28px;background:#fff;border-radius:18px;padding:12px;height:130px}
.mbhero .logo-chip img{height:100%;width:auto}
.mbhero h1{font-size:clamp(2.4rem,6vw,5rem);max-width:820px} .mbhero > div:last-child{padding-top:150px}
.hl{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}
.hl div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;font-weight:700}
.hl div::before{content:"✓";display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#0F1311;margin-bottom:12px}
@media (max-width:860px){.hl{grid-template-columns:1fr 1fr}}
.bbs{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.bbs span{font:800 clamp(2rem,5vw,3.6rem)/1 var(--display);letter-spacing:-.03em}
.bbs span:nth-child(2){color:var(--accent)} .bbs span:nth-child(3){-webkit-text-stroke:2px var(--text);color:transparent}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:56px}
@media (max-width:860px){.cols2{grid-template-columns:1fr;gap:28px}}
.cols2 p{color:#cfd4d0}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px}
.ticks{list-style:none;padding:0;margin:0}
.ticks li{padding:10px 0 10px 32px;position:relative;border-bottom:1px solid var(--line)} .ticks li:last-child{border:0}
.ticks li::before{content:"→";position:absolute;left:0;color:var(--accent);font-weight:700}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:860px){.why{grid-template-columns:1fr 1fr}} @media (max-width:520px){.why{grid-template-columns:1fr}}
.why div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.why .i{font:800 2rem var(--display);color:var(--accent)} .why b{display:block;font:700 1.2rem var(--display);margin:10px 0 6px} .why p{color:var(--muted);margin:0}
.eq{display:flex;flex-wrap:wrap;gap:10px}
.eq span{background:var(--card);border:1px solid var(--line);padding:12px 18px;border-radius:999px;font-weight:600;font-size:.94rem}
.plans{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:stretch}
@media (max-width:1140px){.plans{grid-template-columns:repeat(3,1fr)}} @media (max-width:700px){.plans{grid-template-columns:1fr}}
.plan{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;display:flex;flex-direction:column}
.plan.featured{background:var(--accent);color:#0F1311;border-color:var(--accent);transform:translateY(-10px)}
.plan.featured .meta,.plan.featured li{color:#2a1b10}
.plan .tagx{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;opacity:.85}
.plan h3{font-size:1.2rem}
.plan .price{font:800 2.6rem/1 var(--display);letter-spacing:-.03em;margin:10px 0 4px} .plan .price small{display:block;margin-top:6px;font:500 .9rem var(--sans);opacity:.7}
.plan .meta{font-size:.82rem;font-weight:700;color:var(--muted);padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid color-mix(in srgb,currentColor 20%,transparent)}
.plan ul{list-style:none;padding:0;margin:0;font-size:.9rem;flex:1} .plan li{padding:5px 0 5px 20px;position:relative;color:#cfd4d0} .plan li::before{content:"•";position:absolute;left:4px}
.partners{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:700px){.partners{grid-template-columns:1fr}}
.partners div{border:1px solid var(--line);border-radius:18px;padding:22px 24px;font:700 1.1rem var(--display)}
.visit{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
@media (max-width:760px){.visit{grid-template-columns:1fr}}
.visit div{background:rgba(15,19,17,.12);border-radius:18px;padding:22px} .visit b{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;opacity:.7}
.visit a{color:#0F1311;font-weight:700}

/* boys & baking */
.pending{display:inline-block;background:rgba(242,193,78,.12);color:var(--gold);border:1px dashed var(--gold);font-size:.78rem;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:20px}
.placeholder{color:#c8b27a!important;font-style:italic}
.bbhero{border-radius:32px;overflow:hidden;position:relative;min-height:420px;display:flex;align-items:flex-end;padding:clamp(28px,5vw,56px);isolation:isolate}
.bbhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(.6)}
.bbhero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(15,19,17,.95),rgba(15,19,17,.2))}
.bbgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:960px){.bbgrid{grid-template-columns:1fr 1fr}} @media (max-width:560px){.bbgrid{grid-template-columns:1fr}}
.bbgrid div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;border-top:4px solid var(--gold)}
.dl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:18px}
.dl div{padding:22px 24px;border-right:1px solid var(--line)} .dl div:last-child{border:0}
.dl b{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
@media (max-width:760px){.dl{grid-template-columns:1fr 1fr}}

/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:960px){.board{grid-template-columns:1fr 1fr}} @media (max-width:600px){.board{grid-template-columns:1fr}}
.member{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px;transition:.25s}
.member:hover{border-color:var(--accent)}
.member .ini{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--green),#2d6b52);color:#0F1311;display:grid;place-items:center;font:800 1.4rem var(--display);margin-bottom:20px}
.member .role{color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:-4px 0 10px}
.member p{color:var(--muted);font-size:.94rem}

/* connect */
.cgrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:24px} @media (max-width:860px){.cgrid{grid-template-columns:1fr}}
.cinfo{display:grid;gap:18px;align-content:start}
.cinfo .box b{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.cinfo .box a{color:var(--text);font-weight:700}
form.contact{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:1fr 1fr;gap:16px}
form.contact .full{grid-column:1/-1}
form.contact label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
@media (max-width:600px){form.contact{grid-template-columns:1fr}}

footer.site{border-top:1px solid var(--line);padding:72px 0 30px;color:var(--muted);font-size:.92rem;margin-top:40px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:36px}
@media (max-width:860px){footer .cols{grid-template-columns:1fr 1fr}} @media (max-width:520px){footer .cols{grid-template-columns:1fr}}
footer h4{color:var(--text);font:700 1rem var(--display);margin:0 0 14px}
footer ul{list-style:none;padding:0;margin:0} footer li{margin-bottom:8px}
footer a{color:var(--muted);text-decoration:none} footer a:hover{color:var(--text)}
footer .legal{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);font-size:.82rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:100;padding:24px}
.lightbox.open{display:grid} .lightbox img{max-height:88vh;border-radius:14px}
.lightbox button{position:absolute;top:16px;right:22px;background:none;border:0;color:#fff;font-size:2.4rem;cursor:pointer}
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="logo" href="#/home" aria-label="Neighborhood Culinary Alliance home"><img src="../assets/nca-logo.png" alt="Neighborhood Culinary Alliance"></a>
  <nav class="main" id="nav" aria-label="Main"></nav>
  <a class="btn hcta" href="#/connect">Connect</a>
  <button class="menu-btn" data-menu-toggle aria-label="Menu" aria-expanded="false">☰</button>
</div></header>

<main id="app"></main>
<footer class="site"><div class="wrap" id="footer"></div></footer>

<script src="../assets/content.js"></script>
<script>
const D = NCA, M = D.incubator;
document.getElementById("nav").innerHTML = D.nav.map(n => `<a href="#/${n.id}" data-nav="${n.id}">${n.label}</a>`).join("");
document.getElementById("footer").innerHTML = `
  <div class="cols">
    <div><img src="../assets/nca-logo.png" alt="" style="height:60px;margin-bottom:16px"><p>Food halls, a bakery-only incubator, and programs that grow the next generation of food entrepreneurs.</p></div>
    <div><h4>Explore</h4><ul>${D.nav.map(n=>`<li><a href="#/${n.id}">${n.label}</a></li>`).join("")}</ul></div>
    <div><h4>Contact NCA</h4><ul><li><a href="${D.org.phoneHref}">${D.org.phone}</a></li><li><a href="mailto:${D.org.email}">${D.org.email}</a></li></ul></div>
    <div><h4>The Mixing Bowl</h4><ul><li><a href="${M.contact.mapUrl}" target="_blank" rel="noopener">${M.contact.address}</a></li><li><a href="mailto:${M.contact.email}">${M.contact.email}</a></li><li>${M.contact.hours}</li></ul></div>
  </div>
  <div class="legal"><span>© ${D.org.year} Neighborhood Culinary Alliance Inc.</span><span>Baltimore · Washington, DC</span></div>`;

const initials = n => { const w = n.replace(/[“”"]/g,"").split(" ").filter(x=>/^[A-Z][a-z]/.test(x)); return (w[0][0] + w[w.length-1][0]); };
const cta = (t, s, href="#/connect", b="Connect with us") => `<section style="padding-top:0"><div class="wrap"><div class="cta-box"><div><h2>${t}</h2>${s?`<p style="margin:12px 0 0;font-weight:600">${s}</p>`:""}</div><a class="btn" href="${href}" ${href.startsWith("http")?'target="_blank" rel="noopener"':""}>${b}</a></div></div></section>`;

window.VIEWS = {
home: d => `
  <section class="hero"><div class="glow" style="background:var(--green);top:-200px;right:-100px"></div><div class="glow" style="background:var(--orange);bottom:-300px;left:-200px"></div>
    <div class="wrap">
      <span class="label">Neighborhood Culinary Alliance</span>
      <h1><span>Food halls.</span><span class="acc">Bakers.</span><span class="o">Neighborhoods.</span></h1>
      <div class="hero-row"><p>We develop food-centered real estate, curate culinary concepts and give food entrepreneurs room to grow, with an emphasis on disenfranchised people and communities.</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="#/projects">Our projects</a><a class="btn ghost" href="#/connect">Connect</a></div></div>
    </div></section>
  <section style="padding-top:0"><div class="wrap"><div class="bento">
    <a class="tile t1" href="#/projects"><img src="../assets/savor-interior.jpg" alt=""><span class="pill" style="background:var(--green)">Food halls</span><span class="go">↗</span><h3>Our Projects</h3><p>Savor Food Hall, The Mill on North, Ninety Ten by DC Sweet Potato Cake, and what’s next.</p></a>
    <a class="tile" href="#/incubator"><img src="../assets/mb-hero.jpg" alt=""><span class="pill" style="background:var(--orange)">The Mixing Bowl</span><span class="go">↗</span><h3>Baking Incubator</h3><p>A bakery-only, GMP-compliant shared kitchen in Baltimore.</p></a>
    <a class="tile" href="#/boys-baking"><img src="${d.boysBaking.image}" alt=""><span class="pill" style="background:var(--gold)">New program</span><span class="go">↗</span><h3>Boys &amp; Baking</h3><p>${d.boysBaking.pending?"Details coming soon.":d.boysBaking.intro}</p></a>
  </div></div></section>
  <section style="padding-top:0"><div class="wrap stats">${d.home.stats.map(s=>`<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div></section>
  <section style="padding-top:20px"><div class="wrap about">
    <div class="portrait"><img src="../assets/hero.jpg" alt="NCA team at a food hall construction site"></div>
    <div><span class="label">${d.home.eyebrow}</span><h2>${d.home.title}</h2><p style="font-size:1.15rem;color:var(--text)">${d.home.mission}</p>${d.home.paragraphs.map(p=>`<p>${p}</p>`).join("")}
      <a class="btn" href="#/connect">Contact Ms. Richardson</a></div>
  </div></section>
  <div class="marq"><div class="track">${[...d.partnerLogos,...d.partnerLogos].map(l=>`<img src="../assets/logos/${l}" alt="" loading="lazy">`).join("")}</div></div>
  <div style="height:100px"></div>
  ${cta("Start your next project with us!", d.home.cta)}`,

projects: d => `
  <div class="phead"><div class="wrap"><span class="label">Explore projects</span><h1>Our Projects</h1><p class="lead">Food halls and culinary destinations developed and curated by NCA.</p>
    <div class="tabs">${d.projects.map(p=>`<a href="#/projects/${p.id}">${p.name}</a>`).join("")}<a href="#/projects/ongoing">Ongoing</a></div></div></div>
  <div class="wrap">${d.projects.map(p=>`<article class="proj" id="${p.id}"><img src="${p.image}" alt="${p.name}">
    <div class="body"><span class="label">${p.kicker}</span><h2>${p.name}</h2><div class="chips">${p.facts.map(f=>`<span>${f}</span>`).join("")}</div><p>${p.text}</p>
    <div class="grid-gal">${p.gallery.slice(0,9).map(g=>`<a href="${gal(g)}" data-lightbox><img src="${gal(g)}" alt="${p.name} photo" loading="lazy"></a>`).join("")}${p.gallery.length>9?`<a class="more" href="${gal(p.gallery[9])}" data-lightbox>+${p.gallery.length-9}</a>`:""}</div></div></article>`).join("")}</div>
  <section id="ongoing" style="scroll-margin-top:90px"><div class="wrap"><span class="label">Future</span><h2>Ongoing Projects</h2>
    <div class="ongo" style="margin-top:36px">${d.ongoing.map(o=>`<article><div class="n">${o.n}</div><h3>${o.name}</h3><p>${o.text}</p></article>`).join("")}</div></div></section>
  ${cta("Have a site that needs a food hall?", "Developers, landlords and municipalities: let’s talk.")}`,

incubator: d => { const m=d.incubator; return `
  <div class="wrap"><div class="mbhero"><img src="${m.heroImage}" alt="Fresh bread in a commercial rack oven"><div class="logo-chip"><img src="${m.logo}" alt="The Mixing Bowl Incubator"></div>
    <div><span class="label">Baking Incubator · An NCA initiative</span><h1>${m.headline}</h1><p style="font-size:1.15rem;color:#d5d9d6;max-width:620px">${m.sub} ${m.pitchSub}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="${m.applyUrl}" target="_blank" rel="noopener">Apply for Membership</a><a class="btn ghost" href="${m.tourUrl}" target="_blank" rel="noopener">Book a Facility Tour</a></div></div></div>
    <div class="hl">${m.highlights.map(h=>`<div>${h}</div>`).join("")}</div></div>
  <section><div class="wrap cols2">
    <div><div class="bbs"><span>Build.</span><span>Bake.</span><span>Scale.</span></div><p style="font-size:1.15rem;color:var(--text)">${m.mission}</p><p>${m.taglineSub}</p></div>
    <div><span class="label">${m.aboutTitle}</span>${m.about.map(p=>`<p>${p}</p>`).join("")}</div>
  </div></section>
  <section style="padding-top:0"><div class="wrap"><span class="label">Who we’re built for</span><h2>${m.pitchTitle}</h2>
    <div class="cols2" style="margin-top:36px;gap:18px">
      <div class="box"><h3>You’re expanding into</h3><ul class="ticks">${m.builtFor.expanding.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="box"><h3>You need</h3><ul class="ticks">${m.builtFor.need.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>
    <div class="why" style="margin-top:18px">${m.why.map((w,i)=>`<div><span class="i">0${i+1}</span><b>${w.t}</b><p>${w.d}</p></div>`).join("")}</div>
  </div></section>
  <section style="padding-top:0"><div class="wrap"><span class="label">Equipment</span><h2>The kitchen</h2><div class="eq" style="margin-top:28px">${m.equipment.map(x=>`<span>${x}</span>`).join("")}</div></div></section>
  <section style="padding-top:0" id="memberships"><div class="wrap"><span class="label">Membership packages</span><h2>Choose the membership<br>that fits your growth</h2><p style="color:var(--muted);max-width:620px">${m.membershipIntro}</p>
    <div class="plans" style="margin-top:44px">${m.memberships.map(p=>`<div class="plan ${p.featured?'featured':''}">${p.featured?'<div class="tagx">★ Most popular</div>':''}<h3>${p.name}</h3>
      <div class="price">${p.price}<small> ${p.per}</small></div><div class="meta">${p.meta}</div><ul>${p.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")}</div></div></section>
  <section style="padding-top:0"><div class="wrap"><span class="label">Our partners</span><h2>From seed to harvest</h2><p style="color:var(--muted);max-width:640px">${m.partnersIntro}</p>
    <div class="partners" style="margin-top:28px">${m.partners.map(p=>`<div>${p}</div>`).join("")}</div></div></section>
  <section style="padding-top:0"><div class="wrap"><div class="cta-box" style="display:block"><h2>${m.cta.title}</h2><p style="font-weight:600;margin:12px 0 24px">${m.cta.sub}</p>
    <a class="btn" href="${m.applyUrl}" target="_blank" rel="noopener">Apply Now</a>
    <div class="visit"><div><b>Visit</b><a href="${m.contact.mapUrl}" target="_blank" rel="noopener">${m.contact.address}</a></div><div><b>Email</b><a href="mailto:${m.contact.email}">${m.contact.email}</a></div><div><b>Hours</b>${m.contact.hours}</div></div>
  </div></div></section>`; },

"boys-baking": d => { const b=d.boysBaking; return `
  <div class="phead" style="padding-bottom:30px"><div class="wrap">${pendingBadge()}<br><span class="label">An NCA program</span><h1>Boys <span class="acc">&amp;</span> Baking</h1>
    <p class="lead ${b.pending?'placeholder':''}">${b.tagline}</p></div></div>
  <div class="wrap"><div class="bbhero"><img src="${b.image}" alt=""><div><p class="${b.pending?'placeholder':''}" style="font-size:1.2rem;max-width:700px">${b.intro}</p><a class="btn" href="#/connect">${b.ctaLabel}</a></div></div></div>
  <section><div class="wrap"><div class="bbgrid">${b.sections.map(s=>`<div><h3>${s.t}</h3><p class="${b.pending?'placeholder':''}">${s.d}</p></div>`).join("")}</div>
    <div class="dl">${b.details.map(x=>`<div><b>${x.k}</b>${x.v}</div>`).join("")}</div></div></section>
  ${cta("Support Boys & Baking", "Volunteer, sponsor, or enroll. We’d love to hear from you.", "#/connect", "Get in touch")}`; },

board: d => `
  <div class="phead"><div class="wrap"><span class="label">Leadership</span><h1>Board of Directors</h1><p class="lead">Leaders in law, real estate, food science, hospitality and entertainment, guiding NCA’s work.</p></div></div>
  <div class="wrap board">${d.board.map(m=>`<div class="member"><div class="ini">${initials(m.name)}</div><h3>${m.name}</h3>${m.role?`<div class="role">${m.role}</div>`:""}${m.bio.map(p=>`<p>${p}</p>`).join("")}</div>`).join("")}</div>`,

connect: d => `
  <div class="phead"><div class="wrap"><span class="label">Contact us</span><h1>Let’s build<br>something.</h1><p class="lead">Planning a food hall, looking for bakery production space, or want to support Boys &amp; Baking? Email us today.</p></div></div>
  <div class="wrap cgrid">
    <div class="cinfo">
      <div class="box"><h3>Neighborhood Culinary Alliance</h3><b>Phone</b><a href="${d.org.phoneHref}">${d.org.phone}</a><b>Email</b><a href="mailto:${d.org.email}">${d.org.email}</a></div>
      <div class="box" style="border-color:var(--orange)"><h3 style="color:var(--orange)">The Mixing Bowl Incubator</h3><b>Visit</b><a href="${M.contact.mapUrl}" target="_blank" rel="noopener">${M.contact.address}</a><b>Email</b><a href="mailto:${M.contact.email}">${M.contact.email}</a><b>Hours</b>${M.contact.hours}</div>
    </div>
    <form class="contact" data-mailto-form><h3 class="full">Get in touch</h3>
      <label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label>
      <label>Phone<input name="phone" type="tel"></label>
      <label>Topic<select name="topic"><option>Food hall / project development</option><option>Baking Incubator membership</option><option>Boys &amp; Baking</option><option>Partnership or sponsorship</option><option>Something else</option></select></label>
      <label class="full">Message<textarea name="message" rows="6" required></textarea></label>
      <div class="full"><button class="btn" type="submit">Send Message</button></div></form>
  </div>`
};
</script>
<script src="../assets/site.js"></script>
</body>
</html>
