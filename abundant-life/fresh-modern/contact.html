<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Abundant Life Market</title>
<meta name="description" content="Questions about products, ordering, or delivery in the DMV? Contact Abundant Life Market.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Contact</span>
      <h1 class="disp">Let’s talk.</h1>
      <p>Questions about products, ordering, or delivery in the DMV area? Send us a note and we’ll get you sorted.</p>
    </div>
  </section>

  <section class="wrap sec">
    <div class="contact-grid">
      <form class="form-card" id="contactForm">
        <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your name" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@email.com" required></div>
        <div class="field"><label for="topic">What’s this about?</label>
          <select id="topic" name="topic">
            <option>Placing an order</option>
            <option>Delivery in my area</option>
            <option>A product question</option>
            <option>Something else</option>
          </select>
        </div>
        <div class="field"><label for="msg">Message</label><textarea id="msg" name="msg" placeholder="Tell us what you need…" required></textarea></div>
        <button class="btn primary" type="submit" style="width:100%;justify-content:center">Send message</button>
      </form>

      <aside class="info-card">
        <h3 class="disp">Find us</h3>
        <div class="info-row"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg></div><div><b>Capitol Heights, MD</b><span>&amp; the DMV Area</span></div></div>
        <div class="info-row"><div class="ic"><svg viewBox="0 0 24 24"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7M5.5 19a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm13 0a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></svg></div><div><b>DMV delivery</b><span>DC · Maryland · Northern Virginia</span></div></div>
        <div class="info-row"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 8l8 5 8-5"/></svg></div><div><b>Ready to order?</b><span>Message us and we’ll arrange PayPal or Cash App.</span></div></div>
        <a class="btn primary" href="shop.html" style="width:100%;justify-content:center;margin-top:8px">Browse the shop</a>
      </aside>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
