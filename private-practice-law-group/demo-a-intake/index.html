<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Private Practice Law Group</title>
<meta name="description" content="Business, real estate and food law attorney for entrepreneurs in Washington, DC and Maryland. Book a flat-fee consultation.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E1B2C;--navy2:#16273D;--ink:#0E1B2C;--text:#334155;--muted:#64748B;--line:#E2E8F0;--bg:#F5F7FA;--white:#fff;
  --lime:#7CC243;--lime-d:#5E9E2B;--gold:#F5B700;--r:14px;--f:"Plus Jakarta Sans",system-ui,sans-serif;--w:1200px}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font:16.5px/1.65 var(--f);color:var(--text);background:var(--white)}
img{max-width:100%;display:block} a{color:var(--lime-d)}
h1,h2,h3{color:var(--ink);font-weight:800;line-height:1.12;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.1rem,4.6vw,3.4rem)} h2{font-size:clamp(1.7rem,3.2vw,2.5rem)} h3{font-size:1.2rem}
p{margin:0 0 1em} .wrap{max-width:var(--w);margin:0 auto;padding:0 22px} section{padding:84px 0}
.eyebrow{display:inline-block;font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--lime-d);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 26px;border-radius:10px;background:var(--lime);color:var(--navy);font:800 1rem var(--f);text-decoration:none;border:0;cursor:pointer;transition:.15s;box-shadow:0 6px 18px rgba(124,194,67,.35)}
.btn:hover{background:#8fd456;transform:translateY(-1px)}
.btn.dark{background:var(--navy);color:#fff;box-shadow:none} .btn.dark:hover{background:var(--navy2)}
.btn.outline{background:transparent;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.btn.block{width:100%}
.ph{background:#FFF3C4;color:#7A5B00;border-radius:4px;padding:0 5px}
.callink{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);text-decoration:none}
.callink svg{width:18px;height:18px}
/* header */
.topbar{background:var(--navy);color:#cbd5e1;font-size:.85rem}
.topbar .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.topbar b{color:#fff}
header.site{position:sticky;top:0;z-index:60;background:#fff;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(14,27,44,.05)}
header.site .wrap{display:flex;align-items:center;gap:22px;height:78px}
.logo img{height:50px;width:auto}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{color:var(--text);text-decoration:none;font-weight:600;font-size:.92rem;padding:10px 12px;border-radius:8px}
nav.main a:hover,nav.main a.active{color:var(--navy);background:var(--bg)}
nav.main a[data-nav=book]{display:none}
.hcall{display:flex;flex-direction:column;line-height:1.2;text-align:right;text-decoration:none}
.hcall small{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em} .hcall b{color:var(--navy);font-size:1.05rem}
.hbook{padding:13px 20px}
.menu-btn{display:none;background:var(--bg);border:0;border-radius:8px;padding:10px 14px;font:700 .9rem var(--f);cursor:pointer;margin-left:auto}
@media (max-width:1100px){.hcall{display:none}}
@media (max-width:960px){.menu-btn{display:block} .hbook{display:none}
  nav.main{position:fixed;inset:78px 0 auto 0;background:#fff;flex-direction:column;padding:10px 18px 22px;border-bottom:1px solid var(--line);transform:translateY(-130%);transition:.25s;margin:0}
  body.menu-open nav.main{transform:none} nav.main a{padding:14px 10px;font-size:1.05rem} nav.main a[data-nav=book]{display:block}}
/* mobile sticky action bar */
.mbar{display:none}
@media (max-width:760px){.mbar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:70;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
  .mbar a{padding:16px;text-align:center;font-weight:800;text-decoration:none} .mbar .c{background:var(--navy);color:#fff} .mbar .b{background:var(--lime);color:var(--navy)}
  body{padding-bottom:58px}}
/* hero */
.hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#cbd5e1;padding:64px 0 72px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(124,194,67,.25),transparent 70%)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;position:relative;z-index:1}
@media (max-width:920px){.hero .wrap{grid-template-columns:1fr}}
.hero h1{color:#fff} .hero h1 span{color:var(--lime)}
.hero .sub{font-size:1.15rem;max-width:560px}
.checks{list-style:none;padding:0;margin:20px 0 26px;display:grid;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start;color:#e2e8f0;font-weight:500}
.checks li::before{content:"✓";flex:0 0 22px;height:22px;border-radius:50%;background:var(--lime);color:var(--navy);font-weight:800;font-size:.8rem;display:grid;place-items:center;margin-top:2px}
.rating{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:.9rem}
.rating .stars{color:var(--gold);letter-spacing:2px;font-size:1.1rem}
.formcard{background:#fff;border-radius:18px;padding:30px;box-shadow:0 30px 60px rgba(0,0,0,.3);color:var(--text)}
.formcard h2{font-size:1.5rem;margin-bottom:4px} .formcard .lead{color:var(--muted);font-size:.95rem;margin-bottom:18px}
.formcard form{display:grid;gap:12px}
input,select,textarea{font:500 1rem var(--f);width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--lime);box-shadow:0 0 0 4px rgba(124,194,67,.2)}
.formcard .or{text-align:center;font-size:.9rem;color:var(--muted);margin-top:12px}
.secure{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:10px}
.sent{background:#F0F9E8;border:1.5px solid var(--lime);border-radius:12px;padding:22px;color:var(--ink)} .sent strong{font-size:1.2rem;display:block;margin-bottom:6px}
/* trust bar */
.trust{background:var(--bg);padding:26px 0;border-bottom:1px solid var(--line)}
.trust .wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.trust span{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.trust img{height:46px;width:auto;max-width:110px;object-fit:contain;filter:grayscale(1);opacity:.75}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;text-align:center}
.stats b{display:block;font-size:2.2rem;font-weight:800;color:var(--navy);line-height:1}
.stats span{font-size:.88rem;color:var(--muted)}
@media (max-width:800px){.stats{grid-template-columns:1fr 1fr}}
/* cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:1000px){.cards{grid-template-columns:1fr 1fr}} @media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;transition:.2s}
.card:hover{border-color:var(--lime);box-shadow:0 14px 30px rgba(14,27,44,.08)}
.card .ic{width:46px;height:46px;border-radius:12px;background:#EEF7E6;color:var(--lime-d);display:grid;place-items:center;font-weight:800;margin-bottom:16px}
.card ul{padding-left:18px;margin:0 0 18px;color:var(--muted);font-size:.92rem;flex:1}
.card .go{font-weight:700;text-decoration:none;color:var(--navy)} .card .go:hover{color:var(--lime-d)}
.center{text-align:center} .narrow{max-width:700px;margin-left:auto;margin-right:auto}
.alt{background:var(--bg)}
/* split */
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
@media (max-width:880px){.split{grid-template-columns:1fr;gap:32px}}
.photo{border-radius:20px;overflow:hidden;position:relative}
.photo img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top}
.photo .tag{position:absolute;left:16px;bottom:16px;right:16px;background:rgba(14,27,44,.92);color:#fff;border-radius:12px;padding:14px 16px}
.photo .tag b{display:block} .photo .tag span{font-size:.85rem;color:#cbd5e1}
.creds{list-style:none;padding:0;margin:18px 0 26px;display:grid;gap:10px}
.creds li{padding:12px 14px 12px 44px;background:var(--bg);border-radius:10px;position:relative;font-weight:600;color:var(--ink);font-size:.95rem}
.creds li::before{content:"★";position:absolute;left:16px;color:var(--lime-d)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:s}
@media (max-width:800px){.steps{grid-template-columns:1fr}}
.steps div{background:#fff;border-radius:var(--r);padding:28px;border:1px solid var(--line);counter-increment:s;position:relative}
.steps div::before{content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--lime);font-weight:800;display:grid;place-items:center;margin-bottom:14px}
.steps p{color:var(--muted);margin:0}
/* testimonials */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px} @media (max-width:860px){.tgrid{grid-template-columns:1fr}}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px}
.tcard .stars{color:var(--gold);letter-spacing:2px;margin-bottom:10px} .tcard p{font-size:1.02rem;color:var(--ink)} .tcard small{color:var(--muted)}
/* pricing */
.plist{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} @media (max-width:900px){.plist{grid-template-columns:1fr 1fr}} @media (max-width:560px){.plist{grid-template-columns:1fr}}
.pitem{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:6px}
.pitem .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pitem h3{font-size:1.05rem;margin:0} .pitem .pr{font-weight:800;color:var(--navy);font-size:1.3rem}
.pitem p{color:var(--muted);font-size:.92rem;margin:0;flex:1} .pitem a{font-weight:700;font-size:.9rem;text-decoration:none;color:var(--lime-d);margin-top:6px}
/* faq */
.faq{max-width:820px;margin:0 auto}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 20px}
.faq summary{cursor:pointer;font-weight:700;color:var(--ink);padding:18px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--lime-d)} .faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);padding-bottom:16px;margin:0}
/* final cta */
.final{background:var(--navy);color:#cbd5e1}
.final .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center} @media (max-width:880px){.final .wrap{grid-template-columns:1fr}}
.final h2{color:#fff}
.cta-inline{background:var(--bg);border-radius:18px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:40px}
.cta-inline b{font-size:1.15rem;color:var(--ink)}
/* page head */
.phead{background:var(--navy);color:#cbd5e1;padding:64px 0}
.phead h1{color:#fff} .phead .sub{font-size:1.1rem;max-width:640px}
.phead .actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:22px}
.phead .callink{color:#fff}
.svc{padding:64px 0;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.svc .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px} @media (max-width:860px){.svc .wrap{grid-template-columns:1fr;gap:20px}}
.svc ul{columns:2;column-gap:28px;padding-left:18px;margin:0} @media (max-width:560px){.svc ul{columns:1}}
.svc li{margin-bottom:8px;break-inside:avoid}
.fgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:36px} @media (max-width:860px){.fgrid{grid-template-columns:1fr}}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:14px} form.f .full{grid-column:1/-1} @media (max-width:560px){form.f{grid-template-columns:1fr}}
form.f label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:700;color:var(--ink)}
.summary{background:var(--bg);border-radius:18px;padding:28px}
.summary .big{font-size:3rem;font-weight:800;color:var(--navy);line-height:1;margin:6px 0 12px}
.disc{font-size:.78rem;color:var(--muted);line-height:1.55;margin-top:14px}
footer.site{background:#08111C;color:#94a3b8;padding:56px 0 26px;font-size:.92rem}
footer .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:30px} @media (max-width:860px){footer .cols{grid-template-columns:1fr 1fr}}
footer h4{color:#fff;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
footer ul{list-style:none;padding:0;margin:0} footer li{margin-bottom:8px} footer a{color:#cbd5e1;text-decoration:none} footer a:hover{color:var(--lime)}
footer .legal{border-top:1px solid #1e293b;margin-top:36px;padding-top:20px;font-size:.78rem;line-height:1.6}
</style>
</head>
<body>
<div class="topbar"><div class="wrap" id="topbar"></div></div>
<header class="site"><div class="wrap">
  <a class="logo" href="#/home"><img src="../assets/pplg-site.png" alt="The Private Practice Law Group"></a>
  <nav class="main" id="nav" aria-label="Main"></nav>
  <a class="hcall" id="hcall"></a>
  <a class="btn hbook" href="#/book">Book a Consultation</a>
  <button class="menu-btn" data-menu-toggle aria-expanded="false">Menu</button>
</div></header>
<main id="app"></main>
<footer class="site"><div class="wrap" id="footer"></div></footer>
<div class="mbar"><a class="c" id="mcall">Call Now</a><a class="b" href="#/book">Book Online</a></div>

<script src="../assets/content.js"></script>
<script src="../assets/site.js"></script>
<script>
const D = PPLG, C = D.firm.contact;
const phone = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>`;
const callA = (cls="callink") => `<a class="${cls}" href="${C.phoneHref}">${phone}${ph(C.phone)}</a>`;
document.getElementById("topbar").innerHTML = `<span>Serving entrepreneurs in <b>${D.geo}</b> · Virtual sessions available</span><span>Flat-fee sessions from <b>$250</b> · Book online 24/7</span>`;
document.getElementById("nav").innerHTML = D.nav.map(n=>`<a href="#/${n.id}" data-nav="${n.id}">${n.label}</a>`).join("");
const hc = document.getElementById("hcall"); hc.href = C.phoneHref; hc.innerHTML = `<small>Call the firm</small><b>${ph(C.phone)}</b>`;
document.getElementById("mcall").href = C.phoneHref;
document.getElementById("footer").innerHTML = `<div class="cols">
  <div><img src="../assets/pplg-png2.png" alt="" style="height:54px;margin-bottom:14px"><p>${D.headline} in ${D.geo}.</p>${callA("callink")}</div>
  <div><h4>Practice areas</h4><ul>${D.services.map(s=>`<li><a href="#/services/${s.id}">${s.name}</a></li>`).join("")}<li><a href="#/consulting">Push Pull Consulting</a></li></ul></div>
  <div><h4>Get started</h4><ul><li><a href="#/book">Book a consultation</a></li><li><a href="#/consulting">Session pricing</a></li><li><a href="#/contact">Contact us</a></li><li><a href="#/about">About the firm</a></li></ul></div>
  <div><h4>Contact</h4><ul><li>${ph(C.phone)}</li><li>${ph(C.email)}</li><li>${D.geo}</li><li>${ph(C.hours)}</li></ul></div></div>
  <div class="legal">© ${D.firm.year} ${D.firm.legal}. ${D.disclaimer} Attorney advertising.</div>`;

const opts = `<option value="">What do you need help with?</option>${D.services.map(s=>`<option>${s.name}</option>`).join("")}<option>Business consulting (Push Pull)</option><option>Not sure yet</option>`;
const quickForm = (title="Get a Clear Plan for Your Business", lead="Tell us what’s going on. We’ll match you with the right session.") => `
  <div class="formcard"><h2>${title}</h2><p class="lead">${lead}</p>
    <form data-demo-form="lead"><input name="name" placeholder="Your name" required aria-label="Your name">
      <input name="contact" placeholder="Phone or email" required aria-label="Phone or email">
      <select name="topic" aria-label="Topic">${opts}</select>
      <button class="btn block" type="submit">Book My Consultation →</button></form>
    <div class="or">or call ${callA()}</div>
    <div class="secure"><span>🔒 Confidential</span><span>⏱ Reply within 1 business day</span></div></div>`;
const stars = "★★★★★";
const ctaInline = (t="Not sure what you need? Start with a one-hour flat-fee session.") => `<div class="cta-inline"><b>${t}</b><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a class="btn" href="#/book">Book a Consultation</a>${callA()}</div></div>`;
const faqBlock = d => `<div class="faq">${d.faq.map(f=>`<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join("")}</div>`;
const testis = d => `<div class="tgrid">${d.testimonials.map(t=>`<div class="tcard"><div class="stars">${stars}</div><p>${ph(t.q)}</p><small>${ph(t.who)} · ${ph(t.biz)}</small></div>`).join("")}</div>`;
const svcIcons = ["B","R","F","P"];

window.VIEWS = {
home: d => `
  <section class="hero"><div class="wrap">
    <div><span class="eyebrow" style="color:var(--lime)">${d.geo}</span>
      <h1>${d.headline.replace("for Entrepreneurs","<span>for Entrepreneurs</span>")}</h1>
      <p class="sub">Attorneys who run businesses of their own, so you get advice that works in the real world, not lawyer code.</p>
      <ul class="checks"><li>Flat-fee strategy sessions from $250. Price shown up front.</li><li>Legal counsel + business consulting under one roof</li><li>Led by ${d.about.attorney.name}, 20+ years in business & real estate law</li></ul>
      <div class="rating"><span class="stars">${stars}</span><span>${ph("[Google rating & review count]")}</span></div></div>
    ${quickForm()}
  </div></section>
  <div class="trust"><div class="wrap"><span>Trusted by</span>${d.clientLogos.slice(0,7).map(l=>`<img src="../assets/logos/${l}" alt="" loading="lazy">`).join("")}</div></div>
  <section><div class="wrap"><div class="center narrow"><span class="eyebrow">How we help</span><h2>Practice areas</h2><p>Pick the area that fits. Every page has a way to book in one click.</p></div>
    <div class="cards" style="margin-top:36px">${d.services.map((s,i)=>`<div class="card"><div class="ic">${svcIcons[i]}</div><h3>${s.name}</h3><ul>${s.items.slice(0,4).map(x=>`<li>${x}</li>`).join("")}</ul><a class="go" href="#/services/${s.id}">See all ${s.name.toLowerCase()} services →</a></div>`).join("")}
      <div class="card" style="background:var(--navy);border-color:var(--navy)"><div class="ic" style="background:var(--lime);color:var(--navy)">P</div><h3 style="color:#fff">Push Pull Consulting</h3><ul style="color:#cbd5e1">${d.pushPull.items.slice(0,4).map(x=>`<li>${x}</li>`).join("")}</ul><a class="go" style="color:var(--lime)" href="#/consulting">See session pricing →</a></div></div>
    ${ctaInline()}</div></section>
  <section class="alt"><div class="wrap"><div class="stats">${d.proof.map(s=>`<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div></div></section>
  <section><div class="wrap split">
    <div class="photo"><img src="${d.about.attorney.photo}" alt="${d.about.attorney.name}"><div class="tag"><b>${d.about.attorney.name}</b><span>Founding Attorney · Entrepreneur</span></div></div>
    <div><span class="eyebrow">Why entrepreneurs choose us</span><h2>An attorney who has built businesses, not just advised them</h2>
      <p>${d.home.notButtonUp}</p><ul class="creds">${d.credentials.map(c=>`<li>${c}</li>`).join("")}</ul>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><a class="btn" href="#/book">Book Time With April</a>${callA()}</div></div>
  </div></section>
  <section class="alt"><div class="wrap"><div class="center narrow"><span class="eyebrow">Simple process</span><h2>How it works</h2></div>
    <div class="steps" style="margin-top:32px">${d.steps.map(s=>`<div><h3>${s.t}</h3><p>${s.d}</p></div>`).join("")}</div>
    <p class="center" style="margin-top:30px"><a class="btn" href="#/book">Start With Step 1</a></p></div></section>
  <section><div class="wrap"><div class="center narrow"><span class="eyebrow">Client reviews</span><h2>What our clients say</h2></div><div style="margin-top:32px">${testis(d)}</div></div></section>
