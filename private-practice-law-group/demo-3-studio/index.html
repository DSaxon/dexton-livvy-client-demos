<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Private Practice Law Group</title>
<meta name="description" content="Business, real estate and food law, plus Push Pull business consulting, for entrepreneurs.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF7F1;--sand:#F2EBE0;--card:#FFFFFF;--ink:#1F2621;--muted:#69706A;--line:#E6DED2;
  --forest:#1E3324;--lime:#7CC243;--plum:#5A2D6B;--plum-l:#EFE5F2;--r:26px;
  --serif:"DM Serif Display",Georgia,serif;--sans:"Outfit",system-ui,sans-serif;--w:1200px}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.7 var(--sans)}
img{max-width:100%;display:block} a{color:var(--plum)}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08;margin:0 0 .45em}
h1{font-size:clamp(2.6rem,6.4vw,5rem)} h2{font-size:clamp(2rem,4vw,3.2rem)} h3{font-size:1.55rem}
h1 em,h2 em{color:var(--plum)}
p{margin:0 0 1em} .wrap{max-width:var(--w);margin:0 auto;padding:0 24px} section{padding:96px 0}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--plum-l);color:var(--plum);font-weight:600;font-size:.82rem;padding:7px 14px;border-radius:999px;margin-bottom:20px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;background:var(--forest);color:#fff;text-decoration:none;font-weight:600;border:2px solid var(--forest);transition:.2s;cursor:pointer;font-family:var(--sans);font-size:.98rem}
.btn:hover{background:var(--plum);border-color:var(--plum)}
.btn.soft{background:transparent;color:var(--forest)} .btn.soft:hover{background:var(--forest);color:#fff}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--forest)} .btn.lime:hover{background:#fff;border-color:#fff}
.ph{background:#FFF1C1;color:#7a5b00;padding:0 8px;border-radius:6px}
header.site{position:sticky;top:0;z-index:50;padding:14px 0;background:rgba(251,247,241,.9);backdrop-filter:blur(10px)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo img{height:54px;width:auto}
nav.main{display:flex;gap:2px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px}
nav.main a{color:var(--muted);text-decoration:none;font-weight:500;font-size:.92rem;padding:9px 15px;border-radius:999px;transition:.2s;white-space:nowrap}
nav.main a:hover{color:var(--ink)} nav.main a.active{background:var(--sand);color:var(--ink)}
nav.main a[data-nav=book]{background:var(--forest);color:#fff} nav.main a[data-nav=book]:hover{background:var(--plum)}
.menu-btn{display:none;background:var(--forest);color:#fff;border:0;border-radius:999px;padding:12px 18px;font:600 .9rem var(--sans);cursor:pointer}
@media (max-width:1040px){.menu-btn{display:block}
  nav.main{position:fixed;inset:82px 14px auto 14px;flex-direction:column;align-items:stretch;border-radius:var(--r);padding:12px;transform:translateY(-140%);transition:.3s;box-shadow:0 24px 50px rgba(31,38,33,.15)}
  body.menu-open nav.main{transform:none} nav.main a{padding:14px 18px;font-size:1.05rem}}
/* hero */
.hero{padding:40px 0 80px}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.hero .lead{font-size:1.2rem;color:var(--muted);max-width:520px}
.frame{position:relative}
.frame img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:220px 220px var(--r) var(--r)}
.frame .badge{position:absolute;left:-24px;bottom:56px;background:var(--card);border-radius:20px;padding:16px 20px;box-shadow:0 20px 40px rgba(31,38,33,.12);display:flex;gap:14px;align-items:center}
.frame .badge .dot{width:46px;height:46px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font:1.3rem var(--serif);color:var(--forest)}
.frame .badge b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem} .frame .badge span{font-size:.82rem;color:var(--muted)}
.frame .note{position:absolute;right:-10px;top:40px;background:var(--plum);color:#fff;border-radius:18px;padding:14px 18px;font:italic 1.05rem/1.3 var(--serif);max-width:200px;transform:rotate(3deg)}
@media (max-width:900px){.frame .badge{left:10px}.frame .note{right:10px}}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:20px} @media (max-width:860px){.trio{grid-template-columns:1fr}}
.soft-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:34px}
.soft-card .ic{width:52px;height:52px;border-radius:16px;background:var(--sand);display:grid;place-items:center;font:1.5rem var(--serif);color:var(--plum);margin-bottom:20px}
.soft-card p{color:var(--muted)}
.svc-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px} @media (max-width:760px){.svc-cards{grid-template-columns:1fr}}
.svc-card{border-radius:var(--r);padding:38px;text-decoration:none;color:inherit;display:flex;flex-direction:column;min-height:260px;transition:.25s}
.svc-card:hover{transform:translateY(-4px)}
.svc-card p{flex:1;opacity:.85} .svc-card .go{font-weight:600}
.c1{background:var(--forest);color:#fff} .c1 h3{color:#fff} .c2{background:var(--plum-l)} .c3{background:var(--sand)} .c4{background:var(--lime);color:var(--forest)}
.band{background:var(--forest);color:#fff;border-radius:40px;padding:clamp(40px,7vw,90px);text-align:center}
.band h2{color:#fff} .band h2 em{color:var(--lime)} .band p{color:#c7d1c9;max-width:640px;margin:0 auto 28px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} @media (max-width:900px){.menu{grid-template-columns:1fr 1fr}} @media (max-width:580px){.menu{grid-template-columns:1fr}}
.ses{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:.2s}
.ses:hover{border-color:var(--plum);box-shadow:0 14px 30px rgba(90,45,107,.12)}
.ses .top{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:10px}
.ses h3{font-size:1.3rem;margin:0} .ses .price{background:var(--plum-l);color:var(--plum);font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap;font-size:.92rem}
.ses p{color:var(--muted);flex:1;font-style:italic} .ses .go{font-weight:600;font-size:.9rem;color:var(--forest)}
.logos{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.logos div{background:var(--card);border:1px solid var(--line);border-radius:18px;width:130px;height:92px;display:grid;place-items:center;padding:14px}
.logos img{max-height:100%;object-fit:contain}
/* pages */
.phead{padding:60px 0 50px}
.phead .lead{font-size:1.2rem;color:var(--muted);max-width:640px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.tabs a{background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;padding:9px 18px;border-radius:999px;font-weight:500;font-size:.92rem} .tabs a:hover{border-color:var(--plum);color:var(--plum)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start} @media (max-width:860px){.two{grid-template-columns:1fr;gap:32px}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.stats div{background:var(--sand);border-radius:18px;padding:18px} .stats b{display:block;font:2.2rem/1 var(--serif);color:var(--plum)} .stats span{font-size:.84rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:1fr}}
.svc{background:var(--card);border:1px solid var(--line);border-radius:32px;padding:clamp(28px,5vw,56px);margin-bottom:20px;scroll-margin-top:100px}
.svc .inner{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px} @media (max-width:860px){.svc .inner{grid-template-columns:1fr;gap:24px}}
.dots{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px} @media (max-width:600px){.dots{grid-template-columns:1fr}}
.dots li{padding:9px 0 9px 22px;position:relative;border-bottom:1px dashed var(--line)}
.dots li::before{content:"";position:absolute;left:0;top:18px;width:9px;height:9px;border-radius:50%;background:var(--lime)}
/* forms */
.fgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px} @media (max-width:860px){.fgrid{grid-template-columns:1fr}}
form.f{background:var(--card);border:1px solid var(--line);border-radius:32px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:1fr 1fr;gap:16px}
form.f .full{grid-column:1/-1} @media (max-width:600px){form.f{grid-template-columns:1fr}}
form.f label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500;color:var(--muted)}
input,select,textarea{font:inherit;background:var(--cream);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:13px 16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--plum);border-color:transparent}
.aside{background:var(--forest);color:#d3dbd5;border-radius:32px;padding:36px;align-self:start}
.aside h3{color:#fff} .aside b{display:block;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin-top:18px;font-weight:600}
.aside .total{font:3.6rem/1 var(--serif);color:#fff;margin:4px 0 12px}
.aside a{color:#fff}
.sent{grid-column:1/-1} .sent strong{font:2rem var(--serif);font-weight:400;color:var(--plum)}
.disc{font-size:.8rem;color:var(--muted);margin-top:16px;line-height:1.6}
footer.site{padding:40px 0 30px}
footer .box{background:var(--card);border:1px solid var(--line);border-radius:40px;padding:clamp(30px,5vw,56px)}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px} @media (max-width:860px){footer .cols{grid-template-columns:1fr 1fr}}
footer h4{font:600 .78rem var(--sans);letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px;color:var(--plum)}
footer ul{list-style:none;padding:0;margin:0} footer li{margin-bottom:8px;color:var(--muted);font-size:.94rem} footer a{color:var(--ink);text-decoration:none} footer a:hover{color:var(--plum)}
footer .legal{border-top:1px solid var(--line);margin-top:36px;padding-top:20px;font-size:.78rem;color:var(--muted);line-height:1.6}
.center{text-align:center}
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="logo" href="#/home"><img src="../assets/pplg-site.png" alt="The Private Practice Law Group"></a>
  <nav class="main" id="nav" aria-label="Main"></nav>
  <button class="menu-btn" data-menu-toggle aria-expanded="false">Menu</button>
</div></header>
<main id="app"></main>
<footer class="site"><div class="wrap" id="footer"></div></footer>

<script src="../assets/content.js"></script>
<script src="../assets/site.js"></script>
<script>
const D = PPLG, C = D.firm.contact;
document.getElementById("nav").innerHTML = D.nav.map(n=>`<a href="#/${n.id}" data-nav="${n.id}">${n.label}</a>`).join("");
document.getElementById("footer").innerHTML = `<div class="box"><div class="cols">
  <div><img src="../assets/pplg-site.png" alt="" style="height:58px;margin-bottom:14px"><p style="color:var(--muted);font-size:.95rem">A law firm inspired by entrepreneurs, with a sister consulting company, ${D.firm.sister}.</p></div>
  <div><h4>Legal</h4><ul>${D.services.map(s=>`<li><a href="#/services/${s.id}">${s.name}</a></li>`).join("")}</ul></div>
  <div><h4>Consulting</h4><ul><li><a href="#/consulting">Push Pull Consulting</a></li><li><a href="#/consulting/sessions">1-hour sessions</a></li><li><a href="#/book">Book online</a></li></ul></div>
  <div><h4>Say hello</h4><ul><li>${ph(C.phone)}</li><li>${ph(C.email)}</li><li>${C.location}</li></ul></div></div>
  <div class="legal">© ${D.firm.year} ${D.firm.legal}. ${D.disclaimer} Attorney advertising.</div></div>`;

const ses = s => `<a class="ses" href="#/book/${s.id}"><div class="top"><h3>${s.name}</h3><span class="price">${money(s.price)}</span></div><p>“${s.q}”</p><span class="go">Book this hour →</span></a>`;
const band = (t, p, b="Book a session", h="#/book") => `<section style="padding-top:0"><div class="wrap"><div class="band"><h2>${t}</h2><p>${p}</p><a class="btn lime" href="${h}">${b}</a></div></div></section>`;

window.VIEWS = {
home: d => { const a=d.about.attorney; return `
  <section class="hero"><div class="wrap">
    <div><span class="chip">Business · Real Estate · Food Law</span>
      <h1>Counsel for the <em>creative</em> entrepreneur.</h1>
      <p class="lead">We blend law and business consulting, so you get advice from attorneys who know what it takes to run a business, because we run businesses of our own.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:28px"><a class="btn" href="#/book">Book a session</a><a class="btn soft" href="#/about">Meet the firm</a></div></div>
    <div class="frame"><img src="${a.photo}" alt="${a.name}">
      <div class="badge"><div class="dot">A</div><div><b>${a.name}</b><span>Entrepreneur Attorney</span></div></div>
      <div class="note">“We do not speak in lawyer code.”</div></div>
  </div></section>
  <section style="padding-top:0"><div class="wrap trio">${d.home.pillars.map((p,i)=>`<div class="soft-card"><div class="ic">${["“","+","↗"][i]}</div><h3>${p.t}</h3><p>${p.d}</p></div>`).join("")}</div></section>
  <section style="padding-top:0"><div class="wrap"><div class="center" style="max-width:640px;margin:0 auto 40px"><span class="chip">How we help</span><h2>Legal services, <em>plus</em> a business partner</h2></div>
    <div class="svc-cards">
      ${d.services.map((s,i)=>`<a class="svc-card c${i+1}" href="#/services/${s.id}"><h3>${s.name}</h3><p>${s.short}</p><span class="go">Explore →</span></a>`).join("")}
      <a class="svc-card c4" href="#/consulting"><h3>Push Pull Consulting</h3><p>${d.pushPull.intro}</p><span class="go">Explore →</span></a>
    </div></div></section>
  <section style="padding-top:0"><div class="wrap"><div class="two" style="align-items:end;margin-bottom:36px"><div><span class="chip">1-hour sessions</span><h2>Which one <em>sounds like you?</em></h2></div><p style="color:var(--muted)">${d.home.insight}</p></div>
    <div class="menu">${d.sessions.slice(0,6).map(ses).join("")}</div>
    <p class="center" style="margin-top:28px"><a class="btn soft" href="#/consulting/sessions">See all ${d.sessions.length} sessions</a></p></div></section>
  <section style="padding-top:0"><div class="wrap center"><span class="chip">They trust us</span><div class="logos" style="margin-top:10px">${d.clientLogos.slice(0,8).map(l=>`<div><img src="../assets/logos/${l}" alt="" loading="lazy"></div>`).join("")}</div></div></section>
  ${band("Smart as hell. <em>Great to be around.</em>", d.home.notButtonUp)}`; },

about: d => { const a=d.about.attorney; return `
  <div class="phead"><div class="wrap"><span class="chip">About us</span><h1>Inspired by <em>entrepreneurs</em></h1><p class="lead">Because we understand you the most.</p></div></div>
  <section style="padding-top:0"><div class="wrap two"><div class="soft-card" style="background:var(--plum-l);border:0"><h2 style="font-size:clamp(1.8rem,3.2vw,2.6rem)">“If you are looking for a button-up attorney, <em>we are not the firm for you.</em>”</h2></div>
    <div>${d.about.paragraphs.map(p=>`<p>${p}</p>`).join("")}</div></div></section>
  <section style="padding-top:0"><div class="wrap two" style="align-items:center"><div class="frame"><img src="${a.photo}" alt="${a.name}"></div>
    <div><span class="chip">${a.role}</span><h2>${a.name}</h2>${a.bio.map(p=>`<p>${p}</p>`).join("")}
      <div class="stats">${a.stats.map(s=>`<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div>
      <p style="margin-top:28px"><a class="btn" href="#/book">Book time with April</a></p></div></div></section>`; },

services: d => `
  <div class="phead"><div class="wrap"><span class="chip">Legal services</span><h1>How we <em>help</em></h1>
    <p class="lead">Legal guidance and representation in business, real estate, and food & restaurant law. No business legal matter is too small for us.</p>
    <div class="tabs">${d.services.map(s=>`<a href="#/services/${s.id}">${s.name}</a>`).join("")}<a href="#/consulting">Push Pull Consulting</a></div></div></div>
  <section style="padding-top:0"><div class="wrap">${d.services.map(s=>`<div class="svc" id="${s.id}"><div class="inner">
    <div><h2>${s.name}</h2><p style="color:var(--muted)">${s.intro}</p><a class="btn" href="#/book">Book a consultation</a></div>
    <ul class="dots">${s.items.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>`).join("")}</div></section>
  ${band("Not sure <em>what you need?</em>", d.home.insight)}`,

consulting: d => `
  <div class="phead"><div class="wrap"><span class="chip">${d.firm.sister}</span><h1>Let’s grow <em>your business</em></h1><p class="lead">${d.pushPull.intro}</p></div></div>
  <section style="padding-top:0"><div class="wrap"><div class="svc"><div class="inner"><div><h2>${d.pushPull.name}</h2><p style="color:var(--muted)">Non-legal business services: consulting, strategic development, marketing, branding, brokerage, and finance sourcing.</p></div>
    <ul class="dots">${d.pushPull.items.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></div></section>
  <section style="padding-top:0" id="sessions"><div class="wrap"><div class="center" style="max-width:620px;margin:0 auto 36px"><span class="chip">Schedule online today</span><h2>1-hour <em>consulting sessions</em></h2><p style="color:var(--muted)">${d.sessionNote} Choose the one that sounds like you.</p></div>
    <div class="menu">${d.sessions.map(ses).join("")}</div></div></section>`,

book: d => `
  <div class="phead"><div class="wrap"><span class="chip">Book online</span><h1>Book a <em>session</em></h1><p class="lead">${d.sessionNote} Choose a session, tell us a little about your business, and pick a time that works.</p></div></div>
  <section style="padding-top:0"><div class="wrap fgrid">
    <form class="f" data-demo-form="book">
      <label class="full">Session<select name="session" required><option value="">Choose a session…</option>${d.sessions.map(s=>`<option value="${s.id}">${s.name} · ${money(s.price)}</option>`).join("")}</select></label>
      <label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label>
      <label>Phone<input type="tel" name="phone"></label><label>Business name<input name="biz"></label>
      <label>Preferred date<input type="date" name="date"></label><label>Time of day<select name="time"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label>
      <label class="full">What’s on your mind?<textarea name="msg" rows="4"></textarea></label>
      <div class="full"><button class="btn" type="submit">Continue to payment</button><p class="disc">${d.disclaimer}</p></div></form>
    <aside class="aside"><b style="margin-top:0">Your session</b><div class="total" data-price>—</div><p>One hour, one-on-one with our team. Payment is collected securely when you confirm.</p>
      <b>Prefer to talk first?</b><a href="#/contact">Send us a note →</a></aside>
  </div></section>`,

contact: d => `
  <div class="phead"><div class="wrap"><span class="chip">Contact</span><h1>Let’s start the <em>conversation</em></h1><p class="lead">Give us a call or drop us an email so we can talk about keeping your business legally sound.</p></div></div>
  <section style="padding-top:0"><div class="wrap fgrid">
    <form class="f" data-demo-form="contact">
      <label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label>
      <label>Phone<input type="tel" name="phone"></label>
      <label>I need help with<select name="topic">${d.services.map(s=>`<option>${s.name}</option>`).join("")}<option>Push Pull consulting</option><option>Not sure yet</option></select></label>
      <label class="full">Message<textarea name="msg" rows="6" required></textarea></label>
      <div class="full"><button class="btn" type="submit">Send message</button><p class="disc">${d.disclaimer}</p></div></form>
    <aside class="aside"><h3>${d.firm.name}</h3><b>Phone</b>${ph(C.phone)}<b>Email</b>${ph(C.email)}<b>Location</b>${C.location}<b>Hours</b>${ph(C.hours)}
      <p style="margin-top:26px"><a class="btn lime" href="#/book">Book online</a></p></aside>
  </div></section>`
};
</script>
</body>
</html>
