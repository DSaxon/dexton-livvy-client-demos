<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Private Practice Law Group</title>
<meta name="description" content="Book a flat-fee, one-hour session with a business attorney. Business, real estate and food law for entrepreneurs.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--text:#3F3F46;--muted:#71717A;--line:#E4E4E7;--bg:#FAFAF7;--white:#fff;--lime:#7CC243;--lime-l:#EEF8E5;--lime-d:#4D8A1F;
  --r:16px;--d:"Sora",system-ui,sans-serif;--f:"Inter",system-ui,sans-serif;--w:1180px}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font:16px/1.65 var(--f);color:var(--text);background:var(--white);padding-bottom:76px}
img{max-width:100%;display:block} a{color:var(--lime-d)}
h1,h2,h3{font-family:var(--d);color:var(--ink);font-weight:700;line-height:1.1;margin:0 0 .5em;letter-spacing:-.025em}
h1{font-size:clamp(2.2rem,5vw,3.8rem)} h2{font-size:clamp(1.7rem,3.4vw,2.6rem)} h3{font-size:1.15rem;letter-spacing:-.01em}
p{margin:0 0 1em} .wrap{max-width:var(--w);margin:0 auto;padding:0 22px} section{padding:88px 0}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--lime-l);color:var(--lime-d);font-weight:600;font-size:.82rem;padding:6px 12px;border-radius:999px;margin-bottom:16px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 24px;border-radius:12px;background:var(--ink);color:#fff;font:600 1rem var(--f);text-decoration:none;border:0;cursor:pointer;transition:.15s}
.btn:hover{background:#2a2a2a} .btn.lime{background:var(--lime);color:var(--ink)} .btn.lime:hover{background:#8fd456}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)} .btn.ghost:hover{border-color:var(--ink)}
.ph{background:#FFF3C4;color:#7A5B00;border-radius:4px;padding:0 5px}
header.site{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:20px;height:74px}
.logo img{height:46px;width:auto}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{color:var(--text);text-decoration:none;font-weight:500;font-size:.92rem;padding:9px 12px;border-radius:8px}
nav.main a:hover,nav.main a.active{color:var(--ink);background:var(--bg)} nav.main a[data-nav=book]{display:none}
.hphone{font-weight:600;color:var(--ink);text-decoration:none;font-size:.92rem;white-space:nowrap}
.menu-btn{display:none;margin-left:auto;background:var(--bg);border:0;border-radius:10px;padding:10px 14px;font:600 .9rem var(--f);cursor:pointer}
@media (max-width:1080px){.hphone{display:none}}
@media (max-width:940px){.menu-btn{display:block} header .hb{display:none}
  nav.main{position:fixed;inset:74px 0 auto 0;background:#fff;flex-direction:column;padding:10px 18px 22px;border-bottom:1px solid var(--line);transform:translateY(-130%);transition:.25s;margin:0}
  body.menu-open nav.main{transform:none} nav.main a{padding:14px 10px;font-size:1.05rem} nav.main a[data-nav=book]{display:block}}
/* sticky booking bar */
.bookbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--ink);color:#fff}
.bookbar .wrap{display:flex;align-items:center;gap:16px;height:76px}
.bookbar .sel{flex:1;min-width:0} .bookbar .sel small{display:block;color:#a1a1aa;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}
.bookbar .sel b{font-family:var(--d);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.bookbar .price{font:800 1.5rem var(--d)} .bookbar .call{color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap}
@media (max-width:640px){.bookbar .call{display:none}.bookbar .price{font-size:1.2rem}.bookbar .btn{padding:13px 16px}}
/* hero */
.hero{padding:56px 0 72px;background:linear-gradient(180deg,var(--bg),#fff)}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media (max-width:920px){.hero .wrap{grid-template-columns:1fr}}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,rgba(124,194,67,.45) 62%)}
.hero .sub{font-size:1.15rem;max-width:520px}
.who{display:flex;align-items:center;gap:14px;margin-top:26px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;max-width:440px}
.who img{width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:top}
.who b{display:block;color:var(--ink);font-family:var(--d)} .who span{font-size:.86rem;color:var(--muted)}
.badges{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:.88rem;font-weight:500}
.badges span::before{content:"✓ ";color:var(--lime-d);font-weight:700}
.picker{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 24px 60px rgba(17,17,17,.08)}
.picker h2{font-size:1.25rem;margin:4px 6px 4px} .picker .hint{font-size:.88rem;color:var(--muted);margin:0 6px 14px}
.opts{display:grid;gap:8px;max-height:430px;overflow:auto;padding-right:4px}
.opt{display:flex;align-items:center;gap:14px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:.12s;background:#fff;text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover{border-color:#a1a1aa} .opt.on{border-color:var(--lime);background:var(--lime-l)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid #d4d4d8;flex:0 0 20px;display:grid;place-items:center}
.opt.on .dot{border-color:var(--lime-d)} .opt.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--lime-d)}
.opt .t{flex:1;min-width:0} .opt .t b{display:block;color:var(--ink);font-family:var(--d);font-weight:600;font-size:.98rem} .opt .t span{font-size:.84rem;color:var(--muted)}
.opt .p{font:700 1.05rem var(--d);color:var(--ink)}
.picker .go{display:flex;gap:10px;align-items:center;margin-top:16px} .picker .go .btn{flex:1}
.picker .fine{text-align:center;font-size:.8rem;color:var(--muted);margin:10px 0 0}
/* logos */
.logos{padding:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.logos .wrap{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap}
.logos small{font-weight:600;color:var(--muted);font-size:.82rem}
.logos img{height:42px;max-width:100px;object-fit:contain;filter:grayscale(1);opacity:.7}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s} @media (max-width:820px){.steps{grid-template-columns:1fr}}
.steps div{padding:28px;border-radius:var(--r);background:var(--bg);counter-increment:s}
.steps div::before{content:"Step " counter(s);display:inline-block;font:700 .78rem var(--d);color:var(--lime-d);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-bottom:14px}
.steps p{margin:0;color:var(--muted)}
.center{text-align:center} .narrow{max-width:680px;margin-left:auto;margin-right:auto}
.alt{background:var(--bg)}
/* compare */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px} @media (max-width:820px){.compare{grid-template-columns:1fr}}
.cbox{border:1px solid var(--line);border-radius:22px;padding:32px;background:#fff}
.cbox.dark{background:var(--ink);color:#d4d4d8;border-color:var(--ink)} .cbox.dark h3{color:#fff}
.cbox ul{list-style:none;padding:0;margin:16px 0 22px} .cbox li{padding:8px 0 8px 26px;position:relative;border-bottom:1px solid rgba(128,128,128,.18)}
.cbox li::before{content:"✓";position:absolute;left:0;color:var(--lime);font-weight:700}
/* sessions grid */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} @media (max-width:900px){.sgrid{grid-template-columns:1fr 1fr}} @media (max-width:560px){.sgrid{grid-template-columns:1fr}}
.scard{border:1.5px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;background:#fff;transition:.15s}
.scard:hover{border-color:var(--lime);transform:translateY(-2px)}
.scard .pr{font:800 1.9rem/1 var(--d);color:var(--ink);margin-bottom:10px} .scard .pr small{font:500 .82rem var(--f);color:var(--muted)}
.scard p{color:var(--muted);flex:1;font-size:.95rem}
/* attorney */
.att{display:grid;grid-template-columns:.8fr 1.2fr;gap:52px;align-items:center} @media (max-width:860px){.att{grid-template-columns:1fr}}
.att img{border-radius:24px;width:100%;aspect-ratio:1;object-fit:cover;object-position:top}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0} .nums div{background:var(--bg);border-radius:14px;padding:16px}
.nums b{display:block;font:800 1.8rem/1 var(--d);color:var(--ink)} .nums span{font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.nums{grid-template-columns:1fr}}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} @media (max-width:860px){.tgrid{grid-template-columns:1fr}}
.tcard{border:1px solid var(--line);border-radius:var(--r);padding:24px;background:#fff} .tcard .s{color:#F5B700;letter-spacing:2px}
.tcard p{color:var(--ink)} .tcard small{color:var(--muted)}
.faq{max-width:780px;margin:0 auto}
.faq details{border-bottom:1px solid var(--line);padding:0 4px}
.faq summary{cursor:pointer;font:600 1.05rem var(--d);color:var(--ink);padding:20px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--lime-d);font-size:1.4rem;line-height:1} .faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);margin:0 0 18px}
.band{background:var(--ink);color:#d4d4d8;border-radius:28px;padding:clamp(36px,6vw,72px);display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
.band h2{color:#fff;margin:0}
/* pages */
.phead{padding:64px 0 40px;background:var(--bg);border-bottom:1px solid var(--line)}
.phead .sub{font-size:1.1rem;max-width:640px}
.svcblock{padding:56px 0;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.svcblock .wrap{display:grid;grid-template-columns:1fr 1fr;gap:44px} @media (max-width:860px){.svcblock .wrap{grid-template-columns:1fr;gap:18px}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:start} .chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.9rem}
.fgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:32px} @media (max-width:860px){.fgrid{grid-template-columns:1fr}}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:14px} form.f .full{grid-column:1/-1} @media (max-width:560px){form.f{grid-template-columns:1fr}}
form.f label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600;color:var(--ink)}
input,select,textarea{font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--lime);box-shadow:0 0 0 4px rgba(124,194,67,.2)}
.summary{background:var(--bg);border-radius:20px;padding:28px} .summary .big{font:800 3rem/1 var(--d);color:var(--ink);margin:6px 0 12px}
.sent{grid-column:1/-1;background:var(--lime-l);border-radius:14px;padding:22px} .sent strong{font-family:var(--d);font-size:1.2rem;display:block}
.disc{font-size:.78rem;color:var(--muted);line-height:1.55;margin-top:14px}
footer.site{padding:56px 0 30px;border-top:1px solid var(--line);font-size:.92rem}
footer .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:28px} @media (max-width:860px){footer .cols{grid-template-columns:1fr 1fr}}
footer h4{font:600 .8rem var(--d);text-transform:uppercase;letter-spacing:.1em;color:var(--ink);margin:0 0 12px}
footer ul{list-style:none;padding:0;margin:0} footer li{margin-bottom:8px;color:var(--muted)} footer a{color:var(--text);text-decoration:none} footer a:hover{color:var(--lime-d)}
footer .legal{border-top:1px solid var(--line);margin-top:32px;padding-top:18px;font-size:.78rem;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="logo" href="#/home"><img src="../assets/pplg-site.png" alt="The Private Practice Law Group"></a>
  <nav class="main" id="nav" aria-label="Main"></nav>
  <a class="hphone" id="hphone"></a>
  <a class="btn lime hb" href="#/book" style="padding:11px 18px">Book a Session</a>
  <button class="menu-btn" data-menu-toggle aria-expanded="false">Menu</button>
</div></header>
<main id="app"></main>
<footer class="site"><div class="wrap" id="footer"></div></footer>
<div class="bookbar"><div class="wrap">
  <div class="sel"><small>Selected session · 1 hour</small><b id="bb-name"></b></div>
  <span class="price" id="bb-price"></span><a class="call" id="bb-call"></a>
  <a class="btn lime" id="bb-go" href="#/book">Book Now</a>
</div></div>

<script src="../assets/content.js?v=20261116b"></script>
<script src="../assets/site.js?v=20261116b"></script>
<script>
const D = PPLG, C = D.firm.contact;
let picked = D.sessions[0].id;
const sess = id => D.sessions.find(s=>s.id===id) || D.sessions[0];
function syncBar(){ const s=sess(picked); document.getElementById("bb-name").textContent=s.name; document.getElementById("bb-price").textContent=money(s.price); document.getElementById("bb-go").href="#/book/"+s.id;
  document.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o.dataset.id===picked)); const g=document.getElementById("pick-go"); if(g) g.href="#/book/"+s.id; const p=document.getElementById("pick-price"); if(p) p.textContent=money(s.price); }
document.addEventListener("click",e=>{const o=e.target.closest(".opt"); if(o){picked=o.dataset.id; syncBar();}});
document.addEventListener("change",e=>{ if(e.target.name==="session" && e.target.value){picked=e.target.value; syncBar();}});
window.afterRender = () => { const a=location.hash.split("/")[2]; if(a && D.sessions.some(s=>s.id===a)) picked=a; syncBar(); };

document.getElementById("nav").innerHTML = D.nav.map(n=>`<a href="#/${n.id}" data-nav="${n.id}">${n.id==="consulting"?"Sessions & Pricing":n.label}</a>`).join("");
const hp=document.getElementById("hphone"); hp.href=C.phoneHref; hp.innerHTML=`📞 ${ph(C.phone)}`;
const bc=document.getElementById("bb-call"); bc.href=C.phoneHref; bc.innerHTML=`or call ${ph(C.phone)}`;
document.getElementById("footer").innerHTML = `<div class="cols">
  <div><img src="../assets/pplg-site.png" alt="" style="height:50px;margin-bottom:12px"><p style="color:var(--muted)">${D.headline}. ${D.geo}.</p></div>
  <div><h4>Book</h4><ul><li><a href="#/book">Book a session</a></li><li><a href="#/consulting">Sessions & pricing</a></li><li><a href="#/contact">Ask a question</a></li></ul></div>
  <div><h4>Legal services</h4><ul>${D.services.map(s=>`<li><a href="#/services/${s.id}">${s.name}</a></li>`).join("")}</ul></div>
  <div><h4>Contact</h4><ul><li>${ph(C.phone)}</li><li>${ph(C.email)}</li><li>${D.geo}</li></ul></div></div>
  <div class="legal">© ${D.firm.year} ${D.firm.legal}. ${D.disclaimer} Attorney advertising.</div>`;

const scard = s => `<div class="scard"><div class="pr">${money(s.price)} <small>/ 1 hour</small></div><h3>${s.name}</h3><p>“${s.q}”</p><a class="btn ghost" href="#/book/${s.id}">Book this session</a></div>`;
const faq = d => `<div class="faq">${d.faq.map(f=>`<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join("")}</div>`;
const band = (t="Pick a session. Get a plan. It takes two minutes.") => `<section style="padding-top:0"><div class="wrap"><div class="band"><h2>${t}</h2><a class="btn lime" href="#/book">Book a Session</a></div></div></section>`;
const steps = d => `<div class="steps">${d.steps.map(s=>`<div><h3>${s.t}</h3><p>${s.d}</p></div>`).join("")}</div>`;

window.VIEWS = {
home: d => { const a=d.about.attorney; return `
  <section class="hero"><div class="wrap">
    <div><span class="pill">Business · Real Estate · Food Law</span>
      <h1>Talk to a business attorney this week. <em>Flat fee.</em> No surprises.</h1>
      <p class="sub">One-hour strategy sessions for entrepreneurs, from $250. Get legal and business advice from attorneys who run businesses of their own.</p>
      <div class="who"><img src="${a.photo}" alt=""><div><b>${a.name}</b><span>20+ years in business & real estate law · 15 years as a food entrepreneur</span></div></div>
      <div class="badges"><span>Price shown up front</span><span>Virtual or in person</span><span>Book online 24/7</span></div></div>
    <div class="picker"><h2>Which one sounds like you?</h2><p class="hint">Pick a session to see the price, then book.</p>
      <div class="opts">${d.sessions.map(s=>`<button type="button" class="opt" data-id="${s.id}"><span class="dot"></span><span class="t"><b>${s.name}</b><span>${s.q}</span></span><span class="p">${money(s.price)}</span></button>`).join("")}</div>
      <div class="go"><a class="btn lime" id="pick-go" href="#/book">Book this session · <span id="pick-price"></span></a></div>
      <p class="fine">Not sure? <a href="#/contact">Ask us which session fits →</a></p></div>
  </div></section>
  <div class="logos"><div class="wrap"><small>Trusted by food & business brands</small>${d.clientLogos.slice(0,7).map(l=>`<img src="../assets/logos/${l}" alt="" loading="lazy">`).join("")}</div></div>
  <section><div class="wrap"><div class="center narrow"><span class="pill">How it works</span><h2>From “I’m stuck” to a plan in one hour</h2></div><div style="margin-top:32px">${steps(d)}</div></div></section>
  <section class="alt"><div class="wrap"><div class="center narrow"><span class="pill">Two ways we help</span><h2>Legal counsel and business strategy, under one roof</h2><p>${d.home.insight}</p></div>
    <div class="compare" style="margin-top:32px">
      <div class="cbox"><h3>The Private Practice Law Group</h3><p style="color:var(--muted)">Legal services</p><ul>${d.services.map(s=>`<li><b>${s.name}:</b> ${s.items.slice(0,3).join(", ").toLowerCase()}</li>`).join("")}</ul><a class="btn ghost" href="#/services">See legal services</a></div>
      <div class="cbox dark"><h3>Push Pull Consulting</h3><p>Business services</p><ul>${d.pushPull.items.slice(0,5).map(x=>`<li>${x}</li>`).join("")}</ul><a class="btn lime" href="#/consulting">See sessions & pricing</a></div>
    </div></div></section>
  <section><div class="wrap att"><img src="${a.photo}" alt="${a.name}">
    <div><span class="pill">Your attorney</span><h2>${a.name}</h2><p>${a.bio[0]} ${a.bio[1]}</p>
      <div class="nums">${a.stats.map(s=>`<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div><a class="btn" href="#/book">Book Time With April</a></div></div></section>
  <section class="alt"><div class="wrap"><div class="center narrow"><span class="pill">Reviews</span><h2>What clients say</h2></div>
    <div class="tgrid" style="margin-top:28px">${d.testimonials.map(t=>`<div class="tcard"><div class="s">★★★★★</div><p>${ph(t.q)}</p><small>${ph(t.who)} · ${ph(t.biz)}</small></div>`).join("")}</div></div></section>
  <section><div class="wrap"><div class="center narrow"><span class="pill">FAQ</span><h2>Good questions</h2></div><div style="margin-top:20px">${faq(d)}</div></div></section>
  ${band()}`; },

about: d => { const a=d.about.attorney; return `
  <div class="phead"><div class="wrap"><span class="pill">About</span><h1>We do not speak in lawyer code</h1><p class="sub">${d.home.lead}</p><a class="btn lime" href="#/book">Book a Session</a></div></div>
  <section><div class="wrap att"><img src="${a.photo}" alt="${a.name}"><div><h2>${a.name}</h2>${a.bio.map(p=>`<p>${p}</p>`).join("")}<div class="nums">${a.stats.map(s=>`<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div></div></div></section>
  <section class="alt"><div class="wrap narrow">${d.about.paragraphs.map(p=>`<p>${p}</p>`).join("")}</div></section>${band()}`; },

services: d => `
  <div class="phead"><div class="wrap"><span class="pill">Legal services · ${d.geo}</span><h1>Business, real estate & food law</h1><p class="sub">Every engagement starts with a flat-fee session, so you know the cost before you commit.</p><a class="btn lime" href="#/book">Book a Session</a></div></div>
  ${d.services.map(s=>`<div class="svcblock" id="${s.id}"><div class="wrap"><div><h2>${s.name}</h2><p>${s.intro}</p><a class="btn" href="#/book">Book a ${s.name} session</a></div><div class="chips">${s.items.map(x=>`<span>${x}</span>`).join("")}</div></div></div>`).join("")}
  <section><div class="wrap">${faq(d)}</div></section>${band()}`,

consulting: d => `
  <div class="phead"><div class="wrap"><span class="pill">${d.firm.sister}</span><h1>Sessions & pricing</h1><p class="sub">${d.pushPull.intro} ${d.sessionNote} Flat fee, paid at booking.</p></div></div>
  <section><div class="wrap"><div class="sgrid">${d.sessions.map(scard).join("")}</div></div></section>
  <section class="alt"><div class="wrap"><div class="center narrow"><h2>How it works</h2></div><div style="margin-top:28px">${steps(d)}</div></div></section>
  <section><div class="wrap"><div class="compare"><div class="cbox"><h3>What Push Pull covers</h3><ul>${d.pushPull.items.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <div class="cbox"><h3>Questions</h3>${faq({faq:d.faq.slice(0,4)})}</div></div></div></section>`,

book: d => `
  <div class="phead"><div class="wrap"><span class="pill">Book online · about 2 minutes</span><h1>Book your session</h1><p class="sub">${d.sessionNote} You’ll pick a time and pay securely on the next step.</p></div></div>
  <section><div class="wrap fgrid">
    <form class="f" data-demo-form="book">
      <label class="full">Session<select name="session" required><option value="">Choose a session…</option>${d.sessions.map(s=>`<option value="${s.id}">${s.name} · ${money(s.price)}</option>`).join("")}</select></label>
      <label>Name<input name="name" required></label><label>Phone<input type="tel" name="phone" required></label>
      <label class="full">Email<input type="email" name="email" required></label>
      <label class="full">Anything we should know? (optional)<textarea name="msg" rows="3"></textarea></label>
      <div class="full"><button class="btn lime" style="width:100%" type="submit">Continue to Pick a Time →</button><p class="disc">${d.disclaimer}</p></div></form>
    <aside class="summary"><span class="pill">Order summary</span><div class="big" data-price>—</div><p>1-hour session · flat fee</p>${steps(d).replace('class="steps"','class="steps" style="grid-template-columns:1fr;gap:10px"')}</aside>
  </div></section>`,

contact: d => `
  <div class="phead"><div class="wrap"><span class="pill">Contact</span><h1>Not sure which session fits?</h1><p class="sub">Send a quick note and we’ll point you to the right one, or just call.</p></div></div>
  <section><div class="wrap fgrid">
    <form class="f" data-demo-form="contact"><label>Name<input name="name" required></label><label>Phone or email<input name="contact" required></label>
      <label class="full">What’s going on?<textarea name="msg" rows="5" required></textarea></label><div class="full"><button class="btn" type="submit">Send Message</button><p class="disc">${d.disclaimer}</p></div></form>
    <aside class="summary"><h3>${d.firm.name}</h3><p><b>Phone:</b> ${ph(C.phone)}<br><b>Email:</b> ${ph(C.email)}<br><b>Serving:</b> ${d.geo}<br><b>Hours:</b> ${ph(C.hours)}</p><a class="btn lime" href="#/book">Or book a session now</a></aside>
  </div></section>`
};
</script>
</body>
</html>
